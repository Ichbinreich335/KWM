<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Platzhalter-Flyer Kummerschalen</title>
    <style>
      @font-face {
        font-family: 'Caslon';
        src: url('../../src/assets/fonts/libre-caslon-display-normal-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        src: url('../../src/assets/fonts/jost-normal-latin.woff2') format('woff2');
        font-weight: 300 500;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1240px; height: 1748px; background: #f8f7f4; color: #161616; font-family: 'Jost', sans-serif; }
      .flyer { position: relative; width: 1240px; height: 1748px; padding: 96px 96px 0; display: flex; flex-direction: column; overflow: hidden; }
      .kopf { font-size: 30px; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5b57; }
      h1 { font-family: 'Caslon', Georgia, serif; font-weight: 400; font-size: 180px; line-height: 0.95; margin: 40px 0 28px; }
      .untertitel { font-size: 42px; line-height: 1.3; max-width: 30em; }
      img { display: block; width: 100%; height: 520px; object-fit: cover; margin-top: 40px; }
      .fakten { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 56px; margin-top: 48px; border-top: 2px solid #161616; padding-top: 32px; font-size: 36px; line-height: 1.35; }
      .fakten b { display: block; font-size: 26px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: #5c5b57; margin-bottom: 6px; }
      .vermerk { position: absolute; left: 0; right: 0; bottom: 0; background: #161616; color: #f2f1ee; text-align: center; padding: 34px 40px; font-size: 44px; font-weight: 500; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="flyer">
      <p class="kopf">Niederrheinischer Kunstverein Wesel</p>
      <h1>Kummer&shy;schalen</h1>
      <p class="untertitel">Handgefertigte Schalen der Keramikerin Young-Jae Lee</p>
      <img src="../../src/assets/img/kwm/kummerschalen.webp" alt="" />
      <div class="fakten">
        <p><b>Datum</b>16. August – 31. Oktober 2026</p>
        <p><b>Ort</b>Willibrordi-Dom, Großer Markt, 46483 Wesel</p>
      </div>
      <p class="vermerk">PLATZHALTER – echter Flyer folgt</p>
    </div>
  </body>
</html>
