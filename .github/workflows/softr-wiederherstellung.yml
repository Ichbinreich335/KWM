name: Softr-Wiederherstellung

on:
  workflow_dispatch:
    inputs:
      datum:
        description: "Sicherung vom (JJJJ-MM-TT)"
        required: true
      tabelle:
        description: "Tabelle"
        required: true
        type: choice
        options: [Unikate, Editionsbestand, Modelle, Glasuren, "Künstler:innen", Partner, Lagerorte, Ansichten]
      datensatz:
        description: "Nur dieser Datensatz (ID, leer = ganze Tabelle)"
        required: false
      anwenden:
        description: "Wirklich zurückschreiben (sonst nur anzeigen)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: softr-sicherung
  cancel-in-progress: false

jobs:
  wiederherstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: konzept/softr/sicherung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: konzept/softr/sicherung/package-lock.json
      - run: npm ci
      - name: Sicherung vergleichen und ggf. zurückschreiben
        run: |
          args=(--datum "$DATUM" --tabelle "$TABELLE")
          if [ -n "$DATENSATZ" ]; then args+=(--datensatz "$DATENSATZ"); fi
          if [ "$ANWENDEN" = "true" ]; then args+=(--anwenden); fi
          node restore.mjs "${args[@]}"
        env:
          DATUM: ${{ inputs.datum }}
          TABELLE: ${{ inputs.tabelle }}
          DATENSATZ: ${{ inputs.datensatz }}
          ANWENDEN: ${{ inputs.anwenden }}
          SOFTR_API_KEY: ${{ secrets.SOFTR_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
